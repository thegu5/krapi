      type: object
      additionalProperties: false
      required: [id, type, created_at, target, data]
      properties:
        id:
          type: integer
          description: Event id (only increases; gaps are normal)
        type:
          type: string
          description: Event type (e.g. "map.featured", "map.unfeatured")
        created_at:
          type: string
          format: date-time
          description: When the event happened
        target:
          $ref: '#/components/schemas/EventTarget'
        data:
          description: Type-specific payload (typed for map.featured/map.unfeatured)
          oneOf:
            - $ref: '#/components/schemas/MapEventData'
